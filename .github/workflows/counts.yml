name: Catalog counts
# Fails when README.md, package.json or counts.json states a skill or engine
# count that no longer matches skills/, or when a count is typed by hand in an
# authored file (fix: npm run counts), or when the hosted MCP bundle is stale
# (fix: node platform/mcp-worker/build.mjs).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node platform/scripts/generate-readme.mjs --check
      - name: Hosted MCP bundle is current and in parity with Node
        run: |
          node platform/mcp-worker/build.mjs --check
          node platform/mcp-worker/test.mjs
