name: Catalog counts
# Fails when README.md, package.json or counts.json states a skill or engine
# count that no longer matches skills/, or when a count is typed by hand in an
# authored file (fix: npm run counts), or when the hosted MCP bundle fails to build or its tests fail.
# The bundle (engines.generated.mjs) is built here and is not committed.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node platform/scripts/generate-readme.mjs --check
      - name: Versions agree (package, Claude plugin, MCP registry entry, MCP server)
        run: node platform/scripts/check-versions.mjs
      - name: Hosted MCP bundle builds and is in parity with Node
        run: |
          node platform/mcp-worker/build.mjs
          node platform/mcp-worker/test.mjs
      - name: Engine specs are complete, current, and every engine only analyzes
        run: node platform/scripts/generate-engine-specs.mjs --check
