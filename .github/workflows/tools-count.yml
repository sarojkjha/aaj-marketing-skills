name: Tools count
# The free tool count in counts.json is copied from aajconsult.com/counts.json,
# because the website owns the tools. This compares the copy with the live file
# once a day (and on demand) and fails when they disagree. Fix: npm run sync:tools,
# then commit counts.json and platform/lib/site-counts.mjs.
on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node platform/scripts/sync-tools.mjs --check
