name: Publish from main
# Everything the public sees is published from main, so the repo can never lag
# the live product again (on Oct 11, 2026 the skills site and hosted MCP server
# showed 73 skills while main had 68: they had been deployed from a local copy).
#
# Each job runs only when its secret is set, and says so when it is not:
#   REPO_ADMIN_TOKEN            fine-grained token, this repo, "Administration: write"
#                               -> sets the GitHub About line from counts.json
#   CLOUDFLARE_API_TOKEN        "Edit Cloudflare Workers" token
#   CLOUDFLARE_ACCOUNT_ID       -> deploys the hosted MCP server (platform/mcp-worker)
#   SUPABASE_URL                the skills site's Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY   -> syncs skills/ to skills.aajconsult.com and unpublishes removed slugs
#   LANDING_DISPATCH_TOKEN      fine-grained token, aaj-landing-page-launch, "Contents: write"
#                               -> asks aajconsult.com to pick up the new counts.json now, not tomorrow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node platform/scripts/generate-readme.mjs --check
      - run: node platform/mcp-worker/build.mjs
      - run: node platform/scripts/generate-engine-specs.mjs --check

  about-line:
    needs: check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Set the About line from counts.json
        if: env.GH_TOKEN != ''
        run: |
          about=$(node -p "require('./counts.json').phrases.github_about")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f description="$about" -f homepage="https://skills.aajconsult.com" > /dev/null
          echo "About line: $about" >> "$GITHUB_STEP_SUMMARY"
      - if: env.GH_TOKEN == ''
        run: echo "::notice::REPO_ADMIN_TOKEN is not set, so the About line was not updated. Paste it from 'npm run counts:phrases'."

  mcp-server:
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Deploy the hosted MCP server
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: platform/mcp-worker
        run: |
          node build.mjs
          npx --yes wrangler@4 deploy
          echo "Hosted MCP server deployed from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not set, so the hosted MCP server was not deployed."

  skills-site:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sync skills/ to skills.aajconsult.com
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          npm ci --ignore-scripts
          node platform/scripts/sync-skills.mjs --prune
      - if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::Supabase secrets are not set, so the skills site was not synced."

  notify-site:
    needs: check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
    steps:
      - name: Ask aajconsult.com to refresh its counts
        if: env.GH_TOKEN != ''
        run: gh api -X POST repos/sarojkjha/aaj-landing-page-launch/dispatches -f event_type=skills-catalog-changed > /dev/null
      - if: env.GH_TOKEN == ''
        run: echo "::notice::LANDING_DISPATCH_TOKEN is not set; aajconsult.com picks up counts.json on its daily sync instead."
